<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Panel - VPS Management</title>
    <link rel="stylesheet" href="/static/css/omega.css">
</head>
<body>
    <div class="container">
        <h2>Create New VPS</h2>
        <form id="createVpsForm" action="/vps/create" method="POST">
            <label>VPS Name:</label>
            <input type="text" name="vps_name" required placeholder="my-vps-01">

            <label>Root Password:</label>
            <input type="password" name="root_password" required placeholder="Set strong password">

            <button type="submit" class="btn-create">Create VPS</button>
        </form>
    </div>

    <!-- Deployment Loader Modal -->
    <div id="vpsLoaderModal" class="vps-loader-overlay">
        <div class="vps-loader-card">
            <div class="spinner-ring"></div>
            <h3>Deploying Your VPS...</h3>
            <p id="loaderStepText" class="vps-steps-text">Initializing container environment...</p>
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/omega.js"></script>
</body>
</html>

{% extends 'base.html' %}
{% block content %}
<style>
    /* Input Wrapper & Icons */
    .input-wrap { position: relative; display: flex; align-items: center; margin-top: 4px; }
    .input-wrap svg.icon-left { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--text-dim, #888); pointer-events: none; }
    .input-wrap input { width: 100%; padding: 10px 38px; border: 1px solid var(--border, #333); border-radius: 8px; background: var(--bg-input, #111); color: #fff; }
    
    /* Password Eye Toggle */
    .input-wrap button.toggle-pwd { position: absolute; right: 10px; background: none; border: none; color: var(--text-dim, #888); cursor: pointer; padding: 4px; display: flex; }
    .input-wrap button.toggle-pwd:hover { color: var(--text, #fff); }

    /* Cloudflare Turnstile Spacing */
    .cf-turnstile-wrap { margin: 16px 0; display: flex; justify-content: center; width: 100%; min-height: 65px; }

    /* Auth Divider (OR) */
    .auth-divider { display: flex; align-items: center; text-align: center; margin: 24px 0 16px 0; color: var(--text-dim, #888); font-size: 12px; font-weight: 500;}
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border, #333); margin: 0 12px; }

    /* Social Buttons Styling */
    .social-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-discord { display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #5865F2; color: #fff; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: background 0.2s; }
    .btn-discord:hover { background-color: #4752C4; }
    
    .btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; background-color: #ffffff; color: #000000; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; border: 1px solid #ddd; cursor: pointer; transition: background 0.2s; }
    .btn-google:hover { background-color: #f1f1f1; }
</style>

<div class="auth-wrap">
    <div class="auth-card">
        <span class="eyebrow">RGNODES™</span>
        <h2>{{ _('login') if mode=='login' else _('register') }}</h2>
        
        <form method="post">
            <input type="hidden" name="csrf" value="{{csrf}}">
            
            <label style="display: block; margin-bottom: 12px;">Username
                <div class="input-wrap">
                    <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input name="username" minlength="3" maxlength="32" required autocomplete="username" placeholder="Enter username">
                </div>
            </label>
            
            <label style="display: block; margin-bottom: 12px;">Password
                <div class="input-wrap">
                    <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="auth-pwd" name="password" minlength="8" required autocomplete="{{ 'current-password' if mode=='login' else 'new-password' }}" placeholder="••••••••">
                    
                    <button type="button" class="toggle-pwd" onclick="togglePassword()">
                        <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </label>

            <!-- Cloudflare Turnstile Wrapper (Pushes button down safely) -->
            <div class="cf-turnstile-wrap">
                <!-- আপনার Turnstile কোড এখানে দিন (যেমন: {{ turnstile_html|safe }} ) -->
            </div>

            <button class="btn primary full" type="submit">{{ _('login') if mode=='login' else _('register') }}</button>
        </form>

        <!-- OAuth Social Login Buttons -->
        <div class="auth-divider"><span>OR</span></div>
        
        <div class="social-btns">
            <a href="/login/discord" class="btn-discord">
                <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="#fff"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.09,53,91.04,65.69,84.69,65.69Z"/></svg>
                Continue with Discord
            </a>
            <a href="/login/google" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Continue with Google
            </a>
        </div>

        <p class="muted" style="margin-top: 24px; text-align: center;">
            {% if mode=='login' %}
            Don't have an account? <a href="{{url_for('register')}}">Create one</a>
            {% else %}
            Already have an account? <a href="{{url_for('login')}}">Back to login</a>
            {% endif %}
        </p>
    </div>
</div>

<script>
// Password Show/Hide JS Logic
function togglePassword() {
    const pwdInput = document.getElementById('auth-pwd');
    const eyeIcon = document.getElementById('eye-icon');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        // Eye Off SVG (Crossed out)
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
        pwdInput.type = 'password';
        // Normal Eye SVG
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
}
</script>
{% endblock %}
